name: Android APK

# Builds the PdfCraft web app (WebAssembly), then packages it with Capacitor, the same toolchain
# as HomeMed Cabinet. The Android project (mobile/android) is generated here on every run.
#   * Every push to main/master that touches the app, the web UI or this folder
#   * By hand: Actions > "Android APK" > Run workflow
#   * Tag:     git tag android-v0.9.0 && git push origin android-v0.9.0   (also makes a Release)
on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - "apps/pdfcraft-web/**"
      - "crates/ui-egui/**"
      - ".github/workflows/android.yml"
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with the wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-wasm

      - name: Install Trunk
        run: |
          if curl -fsSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin" trunk; then
            trunk --version
          else
            cargo install trunk --locked
          fi

      # The phone layout (Tools/Inspector as a bottom sheet, larger controls) is a source patch.
      # If it ever stops compiling (after you update the project), the stock UI is built instead.
      - name: Build web app (phone UI)
        id: web_phone
        continue-on-error: true
        run: |
          git apply --whitespace=nowarn mobile/mobile-ui.patch
          cd apps/pdfcraft-web
          trunk build --release

      - name: Build web app (fallback, stock UI)
        if: steps.web_phone.outcome == 'failure'
        run: |
          echo "::warning::The phone UI patch did not build; building the stock UI instead."
          git checkout -- crates apps/pdfcraft-web/src
          rm -rf dist
          cd apps/pdfcraft-web
          trunk build --release

      - name: Read version
        id: ver
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create the Android project (Capacitor)
        working-directory: mobile
        run: |
          test -f ../dist/web/index.html
          npm install
          rm -rf www android
          mkdir www
          cp -R ../dist/web/. www/
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android

      # Optional: sign with your own key (see ANDROID.md). Without it the APK is signed with a
      # debug key: it installs fine, but each build has a different signature.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key."
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx3g
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/PdfCraft-${APP_VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
